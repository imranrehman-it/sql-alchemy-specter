services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spectre
      POSTGRES_PASSWORD: spectre
      POSTGRES_DB: spectre
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectre -d spectre"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
